      <stop stop-color="#7C3AED"/>
      <stop offset="0.45" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#brand)"/>
  <!-- IE = Idowu Elijah -->
  <text
